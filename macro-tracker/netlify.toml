[build]
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[functions]
  node_bundler = "esbuild"

[functions."lookup"]
  timeout = 26

[functions."lookup-image"]
  timeout = 26

[functions."exercise-lookup"]
  timeout = 26

# Barcode may fall back to a web lookup for the official product page
[functions."barcode"]
  timeout = 26

# Coach uses a larger model; give it room beyond the 10s default
[functions."coach-checkin"]
  timeout = 26

# Garmin Personal API: Sync now / backfill can take a while
[functions."garmin-sync"]
  timeout = 26

# Pull from Garmin every 4 hours (no phone needed). Needs GARMIN_PROFILE_ID.
[functions."garmin-sync-scheduled"]
  schedule = "15 */4 * * *"
