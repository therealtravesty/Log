[build]
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[functions]
  node_bundler = "esbuild"

[functions."lookup"]
  timeout = 26

[functions."lookup-image"]
  timeout = 26

[functions."exercise-lookup"]
  timeout = 26

# Barcode may fall back to a web lookup for the official product page
[functions."barcode"]
  timeout = 26

# Coach uses a larger model; give it room beyond the 10s default
[functions."coach-checkin"]
  timeout = 26

# Garmin Personal API: Sync now / backfill can take a while
[functions."garmin-sync"]
  timeout = 26

# Pull from Garmin hourly while you're awake: :15 past each hour, 10:00-04:00 UTC
# = about 6 AM to midnight Eastern (5 AM-11 PM once clocks fall back). The app
# also syncs on open when it's been 15+ minutes. Needs GARMIN_PROFILE_ID.
[functions."garmin-sync-scheduled"]
  schedule = "15 0-4,10-23 * * *"
